<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대전 집 타이밍</title>
<meta name="description" content="대전 아파트 매수 타이밍을 매일 점수와 그래프로 확인하는 개인용 앱">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="집 타이밍">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div>
    <h1>대전 집 타이밍</h1>
    <p id="updated" class="muted small">불러오는 중</p>
  </div>
  <span id="dday" class="dday" hidden></span>
</header>

<div id="sampleBanner" class="banner" hidden>
  <strong>샘플 데이터</strong>
  <span>아래 숫자는 실제 대전 시장이 아닙니다. 화면 구성을 확인하는 용도입니다.</span>
</div>

<main>
  <section id="tab-today" class="tab" aria-labelledby="nav-today"></section>
  <section id="tab-charts" class="tab" aria-labelledby="nav-charts" hidden></section>
  <section id="tab-regions" class="tab" aria-labelledby="nav-regions" hidden></section>
  <section id="tab-money" class="tab" aria-labelledby="nav-money" hidden></section>
  <section id="tab-more" class="tab" aria-labelledby="nav-more" hidden></section>
  <p class="disclaimer">이 앱은 공개 데이터를 정해진 산식으로 계산한 참고 자료이며 투자 자문이 아닙니다. 실제 매수 전에는 최신 시세와 대출 기준을 직접 확인하세요.</p>
</main>

<nav class="tabs" aria-label="화면 이동">
  <button id="nav-today" data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>오늘</button>
  <button id="nav-charts" data-tab="charts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 15l4-5 4 3 5-7" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>그래프</button>
  <button id="nav-regions" data-tab="regions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.800 7 11 7 11z"/><circle cx="12" cy="10" r="2.500" class="hole"/></svg>지역</button>
  <button id="nav-money" data-tab="money"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.500" r="2.800" class="hole"/></svg>자금</button>
  <button id="nav-more" data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>더보기</button>
</nav>

<div id="tooltip" class="tooltip" role="status" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
